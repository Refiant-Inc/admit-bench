name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Windows runners default to cp1252; the code also degrades gracefully
  # without this (utf-8 pinned file I/O + errors=replace console), but UTF-8
  # mode keeps the doctor's glyphs intact in CI logs
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,plugin]"
      - name: Doctor (offline self-check, includes the litmus pair and the answer-key seal)
        run: admitbench doctor
      - name: Base layer — invariants every episode must satisfy
        run: python -m pytest tests/base -q
      - name: Stress layer — metamorphic and gaming tests
        run: python -m pytest tests/stress -q
      - name: Unit layer
        run: python -m pytest tests/unit -q

  wheel-smoke:
    # the install shape users actually get: build the wheel, install it in a
    # clean venv far from the repo, and make the doctor bless it end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel
      - name: Install wheel in a clean venv and run from an empty directory
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          mkdir -p /tmp/nowhere && cd /tmp/nowhere
          /tmp/venv/bin/admitbench doctor
          /tmp/venv/bin/admitbench run --cartridge cstr --provider stub --model oracle --out /tmp/nowhere/run
          /tmp/venv/bin/admitbench validate cstr

  plugin-smoke:
    name: plugin-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and install wheel with plugin extra
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv /tmp/plugin-smoke-venv
          WHEEL="$(ls dist/*.whl)"
          /tmp/plugin-smoke-venv/bin/pip install "${WHEEL}[plugin]"
      - name: MCP initialize + tools/list via entry point
        run: |
          /tmp/plugin-smoke-venv/bin/python - <<'PY'
          import json
          from admitbench.mcp import server as srv
          init = srv.handle({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {}})
          assert init["result"]["serverInfo"]["name"] == "admit-bench"
          tools = srv.handle({"jsonrpc": "2.0", "id": 2, "method": "tools/list"})["result"]["tools"]
          assert {t["name"] for t in tools} == set(srv.TOOLS)
          print("plugin-smoke ok:", sorted(t["name"] for t in tools))
          PY
      - name: Packaged Agent Plugins directory exists
        run: |
          PLUGIN_DIR="$(/tmp/plugin-smoke-venv/bin/admitbench plugin-root)"
          test -f "$PLUGIN_DIR/plugin.json"
          test -f "$PLUGIN_DIR/mcp.json"
          test -f "$PLUGIN_DIR/skills/authoring-cartridges/SKILL.md"
