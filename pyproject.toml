[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "admit-bench"
version = "0.1.0"
description = "ADMIT Bench — Admissible Decisions for Machine Interventions. Admissibility-first evaluation for industrial AI agents: judge the record, not the answer."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]
demo = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# Marker extra for wheel installs that include the MCP entry point and Agent
# Plugins manifests under admitbench/agent_plugin/ (see plugin/INSTALL.md).
plugin = []

[project.scripts]
admitbench = "admitbench.cli:main"
admit-bench-mcp = "admitbench.mcp.server:main"

[tool.setuptools.packages.find]
include = ["admitbench*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
# the bundled cartridges ARE the benchmark — a wheel without them is a
# falsely-green install, which the doctor now refuses to bless
admitbench = [
    "cartridges/*/*.yaml",
    "cartridges/*/*.jsonl",
    "agent_plugin/plugin.json",
    "agent_plugin/mcp.json",
    "agent_plugin/skills/*/SKILL.md",
    "ifac_demo/scenarios/*.yaml",
    "ifac_demo/static/*.html",
    "ifac_demo/static/*.css",
    "ifac_demo/static/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
